<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ducky2evilcrow — DuckyScript → Evil Crow Cable Wind</title>
<style>
  :root{--bg:#0f1216;--panel:#171c22;--edge:#262d36;--fg:#e6e9ee;--dim:#8b95a3;
        --accent:#6ee7b7;--mono:ui-monospace,Menlo,Consolas,monospace}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif}
  .wrap{max-width:1000px;margin:0 auto;padding:22px 20px 50px}
  h1{margin:0 0 4px;font-size:22px} h1 span{color:var(--accent)}
  .sub{color:var(--dim);font-size:13px;margin-bottom:18px} .sub a{color:var(--accent)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  @media(max-width:720px){.grid{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--edge);border-radius:10px;overflow:hidden}
  .panel .bar{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;
              border-bottom:1px solid var(--edge);font-size:12px;color:var(--dim)}
  textarea{width:100%;height:380px;background:transparent;color:var(--fg);border:0;padding:12px;
           font-family:var(--mono);font-size:13px;resize:vertical;outline:none;white-space:pre;overflow-x:auto}
  .mid{display:flex;justify-content:center;margin:16px 0}
  #convert{background:var(--accent);color:#0b0f13;border:0;border-radius:8px;padding:10px 26px;
           font-size:15px;font-weight:700;cursor:pointer}
  #convert:hover{filter:brightness(1.08)}
  button.mini{background:#20303a;color:var(--fg);border:1px solid var(--edge);border-radius:7px;
              padding:4px 11px;font-size:12px;cursor:pointer} button.mini:hover{background:#294050}
</style>
</head>
<body>
<div class="wrap">
  <h1>ducky2<span>evilcrow</span></h1>
  <div class="sub">Paste a Flipper/Hak5 <b>DuckyScript</b> BadUSB payload, hit Convert, get
    <b>Evil Crow Cable Wind</b> syntax. Runs entirely in your browser.
    · <a href="https://github.com/whitewhidow/ducky2evilcrow">source</a></div>

  <div class="grid">
    <div class="panel">
      <div class="bar"><span>DuckyScript (Flipper / Hak5)</span><button class="mini" id="clear">clear</button></div>
      <textarea id="in" spellcheck="false"></textarea>
    </div>
    <div class="panel">
      <div class="bar"><span>Evil Crow Cable Wind</span><button class="mini" id="copy">copy</button></div>
      <textarea id="out" spellcheck="false" readonly></textarea>
    </div>
  </div>

  <div class="mid"><button id="convert">Convert ↓</button></div>
</div>

<script>
const MODIFIERS={CTRL:'KEY_LEFT_CTRL',CONTROL:'KEY_LEFT_CTRL',ALT:'KEY_LEFT_ALT',SHIFT:'KEY_LEFT_SHIFT',
  GUI:'KEY_LEFT_GUI',WINDOWS:'KEY_LEFT_GUI',WIN:'KEY_LEFT_GUI',COMMAND:'KEY_LEFT_GUI'};
const NAMED_KEYS={ENTER:'KEY_ENTER',RETURN:'KEY_ENTER',TAB:'KEY_TAB',SPACE:'KEY_SPACE',ESC:'KEY_ESC',ESCAPE:'KEY_ESC',
  DELETE:'KEY_DELETE',DEL:'KEY_DELETE',BACKSPACE:'KEY_BACKSPACE',
  UP:'KEY_UP_ARROW',UPARROW:'KEY_UP_ARROW',DOWN:'KEY_DOWN_ARROW',DOWNARROW:'KEY_DOWN_ARROW',
  LEFT:'KEY_LEFT_ARROW',LEFTARROW:'KEY_LEFT_ARROW',RIGHT:'KEY_RIGHT_ARROW',RIGHTARROW:'KEY_RIGHT_ARROW',
  UP_ARROW:'KEY_UP_ARROW',DOWN_ARROW:'KEY_DOWN_ARROW',LEFT_ARROW:'KEY_LEFT_ARROW',RIGHT_ARROW:'KEY_RIGHT_ARROW',
  HOME:'KEY_HOME',END:'KEY_END',INSERT:'KEY_INSERT',PAGEUP:'KEY_PAGE_UP',PAGEDOWN:'KEY_PAGE_DOWN',
  PAGE_UP:'KEY_PAGE_UP',PAGE_DOWN:'KEY_PAGE_DOWN',CAPSLOCK:'KEY_CAPS_LOCK',NUMLOCK:'KEY_NUM_LOCK',
  SCROLLLOCK:'KEY_SCROLL_LOCK',CAPS_LOCK:'KEY_CAPS_LOCK',NUM_LOCK:'KEY_NUM_LOCK',SCROLL_LOCK:'KEY_SCROLL_LOCK',
  PRINTSCREEN:'KEY_PRINT_SCREEN',PRINT_SCREEN:'KEY_PRINT_SCREEN',BREAK:'KEY_PAUSE',PAUSE:'KEY_PAUSE',
  MENU:'KEY_MENU',APP:'KEY_MENU'};
for(let i=1;i<=12;i++) NAMED_KEYS['F'+i]='KEY_F'+i;
const UNSUPPORTED=new Set(['ALTCHAR','ALTCODE','ALTCODEPOINT','WAITFORBUTTONPRESS','WAIT_FOR_BUTTON_PRESS',
  'LED','SYSRQ','INJECT_MOD','GLOBE','VOLUP','VOLDOWN','VOLUME_UP','VOLUME_DOWN','MUTE','PLAYPAUSE','PLAY',
  'STOP','NEXTTRACK','PREVTRACK','BRIGHTNESS_UP','BRIGHTNESS_DOWN','MEDIA',
  'VAR','IF','ELSE','END_IF','WHILE','END_WHILE','FUNCTION','END_FUNCTION','DEFINE']);

function mapKey(t){const u=t.toUpperCase();if(u in NAMED_KEYS)return NAMED_KEYS[u];if(t.length===1)return t;return null;}
function convertCombo(tokens){
  let ex=[];for(const t of tokens){(t.includes('-')&&t.length>1)?ex.push(...t.split('-').filter(p=>p)):ex.push(t);}
  tokens=ex;
  const keys=tokens.filter(t=>!(t.toUpperCase() in MODIFIERS));
  const mods=tokens.filter(t=>t.toUpperCase() in MODIFIERS).map(t=>MODIFIERS[t.toUpperCase()]);
  if(mods.length===0&&keys.length===1){const k=mapKey(keys[0]);return k?[['PressRelease '+k],true]:[null,false];}
  if(keys.length===0&&mods.length){if(mods.length===1)return[['PressRelease '+mods[0]],true];
    return[[...mods.map(m=>'Press '+m),'Release'],true];}
  let out=mods.map(m=>'Press '+m),ok=true;
  for(const k of keys){const mk=mapKey(k);mk===null?ok=false:out.push('PressRelease '+mk);}
  out.push('Release');return[out,ok];
}
function convertText(text){
  const out=[];let dd=0,last=[];const L=text.split(/\r?\n/);let i=0;
  while(i<L.length){
    const s=L[i].trim();i++;
    if(s===''||s.startsWith('//')||s.startsWith('#'))continue;
    const sp=s.indexOf(' '),cu=(sp<0?s:s.slice(0,sp)).toUpperCase(),arg=sp<0?'':s.slice(sp+1);
    let block=null;
    if(cu.startsWith('REM')||['END_STRING','END_STRINGLN','END_REM','ATTACKMODE','DUCKY_LANG','LOCALE'].includes(cu)){continue;}
    else if(cu==='HOLD'){const a=arg.trim().toUpperCase();const k=(a in MODIFIERS)?MODIFIERS[a]:mapKey(arg.trim());
      if(k===null)continue;block=['Press '+k];}
    else if(cu==='RELEASE'){block=['Release'];}
    else if((cu==='STRING'||cu==='STR')&&arg!==''){block=['Print '+arg];}
    else if((cu==='STRINGLN'||cu==='STRLN')&&arg!==''){block=['PrintLine '+arg];}
    else if(['STRING','STR','STRINGLN','STRLN'].includes(cu)){
      const end=(cu==='STRINGLN'||cu==='STRLN')?'END_STRINGLN':'END_STRING';block=[];
      while(i<L.length&&L[i].trim().toUpperCase()!==end){block.push('PrintLine '+L[i]);i++;}
      if(i<L.length)i++;}
    else if(cu==='ALTSTRING'){block=['WinPrint '+arg];}
    else if(cu==='DELAY'){block=['Delay '+arg.trim()];}
    else if(cu==='DEFAULT_DELAY'||cu==='DEFAULTDELAY'){const n=parseInt(arg.trim(),10);dd=isNaN(n)?0:n;continue;}
    else if(cu==='ENTER'||cu==='RETURN'){block=['PressRelease KEY_ENTER'];}
    else if(cu==='REPEAT'){const n=parseInt(arg.trim(),10)||0;for(let r=0;r<n;r++)out.push(...last);continue;}
    else if(UNSUPPORTED.has(cu)){continue;}
    else{const[b,ok]=convertCombo(s.split(/\s+/));if(b===null||!ok)continue;block=b;}
    if(dd>0&&!(block.length===1&&block[0].startsWith('Delay ')))block=block.concat(['Delay '+dd]);
    out.push(...block);if(block.length)last=block;
  }
  return out;
}
const $=id=>document.getElementById(id);
$('convert').onclick=()=>{const out=convertText($('in').value);$('out').value=out.join('\n')+(out.length?'\n':'');};
$('clear').onclick=()=>{$('in').value='';$('out').value='';};
$('copy').onclick=()=>{$('out').select();document.execCommand('copy');};
$('in').value=`REM open an admin PowerShell (Flipper / Hak5 DuckyScript)
DELAY 1000
GUI r
STRING powershell
ENTER
CTRL-ALT t`;
</script>
</body>
</html>
